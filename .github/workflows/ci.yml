name: Javascript testing

on:
  - push
  - pull_request

jobs:
  test:
    name: Run unit tests using Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencides
        run: >-
          npm ci --legacy-peer-deps
      - name: Run unit tests
        run: >-
          npm run test:unit -- --coverage
  cypress:
    name: Run Cypress tests
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-24.22.1-chrome-156.0.8078.73-1-ff-159.0-edge-156.0.4314.50-1
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: >-
          npm ci --legacy-peer-deps
      - name: Start server
        run: npm run start:host > server.log 2>&1 &
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:5173/ --timeout 60000 || (cat server.log; exit 1)
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Removed use of 'start' and 'wait on' because it failed - starting the server in previous step instead.
          spec: 'tests/e2e/**/*'
          config-file: cypress.config.js
          config: video=false
          install: false
          browser: chrome
      # after the test run completes
      # store any screenshots
      # NOTE: screenshots will be generated only if E2E test failed
      # thus we store screenshots only on failures
      # Alternative: create and commit an empty cypress/screenshots folder
      # to always have something to upload
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: tests/e2e/screenshots
